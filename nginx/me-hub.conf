server {
    server_name me.nikpeg.me;
    root /var/www/me-hub;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; frame-src https://oauth.telegram.org; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/me-hub.access.log;
    error_log  /var/log/nginx/me-hub.error.log;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/nikpeg.me.pem;
    ssl_certificate_key /etc/ssl/nikpeg.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    if ($host = me.nikpeg.me) { return 301 https://$host$request_uri; }

    listen 80;
    listen [::]:80;

    server_name me.nikpeg.me;
    return 404;
}
